<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thành Phố Diệu Kỳ</title>
  <link rel="stylesheet" href="./assets/css/sitemap.css">
  <script src="./assets/js/sitemap.js" defer></script>
</head>
<body>
  <div class="map-container">
    <img src="assets/images/main-map.jpeg" alt="Thành phố chính" id="city-map">

    <!-- Vùng tương tác -->
    <div class="map-zone" id="zone-home" title="Khu Nhà Ở"></div>
    <div class="map-zone" id="zone-park" title="Công Viên"></div>
    <div class="map-zone" id="zone-fun" title="Khu Giải Trí"></div>
    <div class="map-zone" id="zone-suburb" title="Khu Ngoại Ô"></div>
    <div class="map-zone" id="zone-farm" title="Nông Trại"></div>
    <div class="map-zone" id="zone-fishing" title="Khu Câu Cá"></div>
    <div class="map-zone" id="zone-airport" title="Sân Bay"></div>
    <div class="map-zone" id="zone-shop" title="Khu Mua Sắm"></div>
  </div>

  <div id="zone-content" class="zone-popup">👋 Click vào khu vực để xem nội dung!</div>
</body>
</html>
