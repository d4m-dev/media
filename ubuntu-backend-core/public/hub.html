<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>d4m-dev | Project Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.3s ease; }
        .glass-card:hover { transform: translateY(-5px); border-color: rgba(59, 130, 246, 0.4); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4); }
        .frozen-card { opacity: 0.6; filter: grayscale(80%); }
    </style>
</head>
<body class="bg-gradient-to-br from-[#0b0f19] via-slate-900 to-[#0b0f19] min-h-screen text-white font-sans antialiased flex flex-col">

    <header class="py-12 text-center relative z-10">
        <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-3">
            <span class="bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">Cloud Project Hub</span>
        </h1>
        <p class="text-gray-400 text-sm md:text-base font-mono tracking-wide">Mạng lưới ứng dụng Serverless cục bộ</p>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-6 w-full relative z-10">
        <div id="loading" class="text-center py-20 hidden">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500 mb-4"></i>
            <p class="text-gray-400">Đang đồng bộ dữ liệu...</p>
        </div>

        <div id="empty-state" class="hidden text-center py-20">
            <i class="fa-solid fa-folder-open text-6xl text-gray-600 mb-4"></i>
            <h2 class="text-2xl font-bold text-gray-300">Không gian trống!</h2>
            <p class="text-gray-500 mt-2">Hệ thống đang chờ lệnh triển khai dự án từ Dashboard.</p>
        </div>

        <!-- DANH SÁCH DỰ ÁN -->
        <div id="project-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mb-12"></div>
    </main>

    <footer class="py-6 border-t border-white/5 bg-black/40 backdrop-blur-md relative z-10">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center text-sm">
            <p class="text-gray-400 mb-4 md:mb-0">Crafted with <i class="fa-solid fa-bolt text-yellow-500 mx-1"></i> by <span class="font-bold text-white tracking-wide">d4m-dev</span></p>
            <a href="/dashboard.html" class="group flex items-center space-x-2 bg-white/5 hover:bg-white/10 px-4 py-2 rounded-full transition-all border border-white/10">
                <i class="fa-solid fa-shield-halved text-lg text-gray-400 group-hover:text-blue-400 transition-colors"></i>
                <span class="font-medium text-gray-300 group-hover:text-white transition-colors">Admin Login</span>
            </a>
        </div>
    </footer>

    <script>
        function stringToColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            return `hsl(${hash % 360}, 60%, 25%)`;
        }

        async function loadProjects() {
            document.getElementById('loading').classList.remove('hidden');
            try {
                // Tự động nhận diện Port động 
                const port = window.location.port ? `:${window.location.port}` : '';
                const apiUrl = `${window.location.protocol}//${window.location.hostname}${port}/api/projects/`;
                
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                document.getElementById('loading').classList.add('hidden');

                if (data.projects.length === 0) {
                    document.getElementById('empty-state').classList.remove('hidden');
                    return;
                }

                const grid = document.getElementById('project-grid');
                grid.innerHTML = '';

                data.projects.forEach(proj => {
                    let techBadge = '';
                    if (proj.has_python) techBadge = `<span class="bg-green-500/10 text-green-400 border border-green-500/20 px-2.5 py-1 rounded-md text-xs font-bold flex items-center"><span class="w-2 h-2 rounded-full bg-green-500 animate-pulse mr-1.5"></span>Python/Flask</span>`;
                    else if (proj.has_html) techBadge = `<span class="bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2.5 py-1 rounded-md text-xs font-bold"><i class="fa-brands fa-html5 mr-1"></i>HTML5</span>`;

                    let coverHtml = proj.thumbnail 
                        ? `<div class="h-36 w-full bg-cover bg-center rounded-t-2xl" style="background-image: url('${proj.thumbnail}')"></div>`
                        : `<div class="h-36 w-full rounded-t-2xl flex items-center justify-center" style="background: linear-gradient(135deg, ${stringToColor(proj.name)}, #0b0f19)"><i class="fa-solid fa-code text-5xl text-white/10"></i></div>`;

                    const cardClass = proj.is_frozen ? 'frozen-card pointer-events-none' : '';
                    const statusText = proj.is_frozen ? 'Bảo trì' : 'Online';
                    const linkButton = proj.is_frozen 
                        ? `<button class="bg-gray-800 text-gray-400 text-sm font-bold py-2 px-4 rounded-xl flex items-center cursor-not-allowed border border-gray-700"><i class="fa-solid fa-lock mr-2"></i> Đã Khóa</button>`
                        : `<a href="/${proj.name}" target="_blank" class="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white text-sm font-bold py-2 px-5 rounded-xl shadow-lg hover:shadow-blue-500/25 transition-all flex items-center active:scale-95">Truy cập <i class="fa-solid fa-arrow-up-right-from-square ml-2 text-xs"></i></a>`;

                    grid.innerHTML += `
                        <div class="glass-card rounded-2xl flex flex-col relative group ${cardClass}">
                            ${coverHtml}
                            <div class="absolute top-4 left-4 bg-black/60 px-2.5 py-1 rounded-md backdrop-blur-md text-[10px] font-black uppercase tracking-wider ${proj.is_frozen ? 'text-red-400 border border-red-500/30' : 'text-green-400 border border-green-500/30'}">
                                <i class="fa-solid fa-circle ${proj.is_frozen ? '' : 'animate-pulse'} mr-1"></i> ${statusText}
                            </div>
                            <div class="p-6 flex flex-col flex-grow">
                                <div class="flex justify-between items-start mb-3">
                                    <h3 class="text-xl font-bold text-white capitalize truncate pr-2">${proj.name.replace(/-/g, ' ')}</h3>
                                    ${techBadge}
                                </div>
                                <p class="text-sm text-gray-400 flex-grow mb-5 line-clamp-2 leading-relaxed">${proj.description}</p>
                                <div class="flex justify-between items-center mt-auto pt-4 border-t border-white/5">
                                    <span class="text-xs text-gray-500 font-mono bg-white/5 px-2 py-1 rounded"><i class="fa-solid fa-hard-drive mr-1.5"></i>${proj.size}</span>
                                    ${linkButton}
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (err) { 
                console.error(err);
                document.getElementById('loading').innerHTML = '<p class="text-red-400 font-bold"><i class="fa-solid fa-triangle-exclamation mr-2"></i>Mất kết nối máy chủ Core!</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadProjects);
    </script>
</body>
</html>
