<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio YT Downloader | Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap');
        body { background-color: #0A0A0A; color: #FFFFFF; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; flex-col; justify-content: center; padding: 2rem 1rem;}
        
        .glass-box { background: #121212; border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; transition: all 0.4s ease; }
        .hover-lift { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .hover-lift:hover { transform: translateY(-3px); }
        
        .progress-btn { position: relative; overflow: hidden; }
        .progress-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; transition: width 0.3s linear; z-index: 0; }
        .progress-text { position: relative; z-index: 10; }
    </style>
</head>
<body class="antialiased">

    <div class="w-full max-w-4xl mx-auto flex flex-col gap-8">
        
        <div class="text-center mb-4">
            <h1 class="text-3xl font-black tracking-tight mb-2 flex justify-center items-center gap-3">
                <i class="fa-brands fa-youtube text-red-500"></i> YouTube Pro
            </h1>
            <p class="text-gray-500 text-sm">Trích xuất Video & Audio siêu tốc</p>
        </div>

        <div class="flex items-center gap-2 bg-[#1A1A1A] p-2 rounded-full border border-white/10 shadow-xl">
            <i class="fa-solid fa-link text-gray-500 ml-4"></i>
            <input type="text" id="ytUrl" class="bg-transparent w-full text-sm text-white px-2 py-3 outline-none" placeholder="Dán đường dẫn YouTube vào đây...">
            <button id="analyzeBtn" onclick="analyzeLink()" class="bg-white text-black font-bold text-sm px-6 py-3 rounded-full hover:scale-105 transition-transform flex items-center gap-2 whitespace-nowrap">
                <span>Phân tích</span>
            </button>
        </div>

        <div id="resultSection" class="hidden opacity-0 transition-opacity duration-700">
            <div class="glass-box p-6 grid grid-cols-1 md:grid-cols-2 gap-8 shadow-2xl">
                
                <div class="rounded-2xl overflow-hidden shadow-2xl border border-white/5 aspect-video bg-[#111] flex items-center justify-center relative group">
                    <img id="ytThumbnail" src="" alt="Thumbnail" class="absolute inset-0 w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity duration-300">
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <div class="w-16 h-16 bg-black/50 backdrop-blur-md rounded-full flex items-center justify-center border border-white/20 shadow-lg transition-all duration-300">
                            <i class="fa-solid fa-play text-white text-xl ml-1"></i>
                        </div>
                    </div>
                    <div id="qualityBadge" class="absolute top-3 right-3 bg-black/70 backdrop-blur-md px-3 py-1 rounded-md text-[10px] font-black tracking-widest text-white border border-white/10 hidden">
                        ĐANG CHỌN...
                    </div>
                </div>
                
                <div class="flex flex-col justify-center">
                    <h2 id="videoTitle" class="text-xl font-bold text-white mb-6 line-clamp-2 leading-snug">Đang quét vệ tinh...</h2>
                    
                    <div id="formatSelection" class="hidden grid-cols-2 gap-4 mb-2">
                        <div onclick="selectFormat('mp4')" class="hover-lift cursor-pointer bg-[#1A1A1A] hover:bg-[#2A2A2A] border border-white/5 p-6 rounded-2xl text-center group">
                            <i class="fa-solid fa-video text-3xl mb-3 text-red-400 group-hover:scale-110 transition-transform"></i>
                            <h3 class="font-bold text-white">Video MP4</h3>
                        </div>
                        <div onclick="selectFormat('mp3')" class="hover-lift cursor-pointer bg-[#1A1A1A] hover:bg-[#2A2A2A] border border-white/5 p-6 rounded-2xl text-center group">
                            <i class="fa-solid fa-music text-3xl mb-3 text-blue-400 group-hover:scale-110 transition-transform"></i>
                            <h3 class="font-bold text-white">Audio MP3</h3>
                        </div>
                    </div>
                    
                    <div id="qualitySelection" class="hidden flex-col h-full">
                        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3 flex justify-between items-center">
                            Chọn chất lượng xuất
                            <button onclick="goBack()" class="text-gray-500 hover:text-white underline lowercase tracking-normal">quay lại</button>
                        </h3>
                        <div id="qualityList" class="flex flex-col gap-2 overflow-y-auto max-h-[220px] pr-2"></div>
                    </div>
                    
                    <div id="progressSection" class="hidden flex-col justify-center flex-1">
                        <button id="downloadBtn" class="progress-btn w-full h-16 bg-[#1A1A1A] border border-white/10 rounded-2xl transition-transform">
                            <div id="progressFill" class="progress-fill bg-gradient-to-r from-red-600 to-orange-500"></div>
                            <div class="progress-text flex items-center justify-center gap-3 font-bold tracking-widest text-sm text-white" id="btnText">
                                ĐANG CHUẨN BỊ...
                            </div>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let videoInfo = null;
        let selectedFormat = null;
        let progressInterval = null;
        
        function extractId(url) {
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i);
            return match ? match[1] : null;
        }

        async function analyzeLink() {
            const url = document.getElementById('ytUrl').value;
            const vid = extractId(url);
            if(!vid) return alert("Sếp nhập sai link YouTube rồi!");
            
            const btn = document.getElementById('analyzeBtn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>'; btn.disabled = true;
            
            // 🚀 BẬT ẢNH BÌA NGAY LẬP TỨC TRƯỚC KHI GỌI API (Zero Lag)
            document.getElementById('ytThumbnail').src = `https://i.ytimg.com/vi/${vid}/maxresdefault.jpg`;
            document.getElementById('videoTitle').innerText = "Đang quét vệ tinh...";
            document.getElementById('qualityBadge').classList.add('hidden');
            
            document.getElementById('resultSection').classList.remove('hidden');
            document.getElementById('resultSection').classList.remove('opacity-0');
            
            document.getElementById('formatSelection').classList.add('hidden');
            document.getElementById('qualitySelection').classList.add('hidden');
            document.getElementById('progressSection').classList.add('hidden');
            
            try {
                // Gọi API lấy dung lượng ngầm phía sau
                const res = await fetch('/api/ytdl/info', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url})
                });
                videoInfo = await res.json();
                
                if(videoInfo.status === 'success') {
                    document.getElementById('videoTitle').innerText = videoInfo.title;
                    // Hiện nút MP4/MP3
                    document.getElementById('formatSelection').classList.remove('hidden');
                    document.getElementById('formatSelection').style.display = 'grid';
                } else {
                    document.getElementById('videoTitle').innerText = "❌ Lỗi: " + videoInfo.detail;
                }
            } catch(e) { document.getElementById('videoTitle').innerText = "❌ Mất kết nối Máy chủ!"; }
            
            btn.innerHTML = 'Phân tích'; btn.disabled = false;
        }

        function selectFormat(fmt) {
            selectedFormat = fmt;
            document.getElementById('formatSelection').style.display = 'none';
            document.getElementById('qualitySelection').classList.remove('hidden');
            
            const qList = document.getElementById('qualityList');
            qList.innerHTML = '';
            
            if(fmt === 'mp4') {
                videoInfo.resolutions.forEach(resObj => {
                    let res = resObj.height; let size = resObj.size;
                    let badge = res >= 1080 ? '<span class="text-[9px] bg-red-500/20 text-red-400 px-2 py-1 rounded ml-2">NÉT CĂNG</span>' : '';
                    qList.innerHTML += `
                        <div onclick="startDownload('${res}', 'MP4 - ${res}p')" class="flex justify-between items-center bg-[#1A1A1A] hover:bg-[#2A2A2A] border border-white/5 p-4 rounded-xl cursor-pointer">
                            <div class="flex items-center gap-3"><i class="fa-solid fa-display text-gray-500"></i><span class="font-bold text-white text-sm">${res}p <span class="text-xs text-gray-400 font-normal ml-2">• ${size}</span> ${badge}</span></div>
                            <i class="fa-solid fa-download text-gray-600"></i>
                        </div>`;
                });
            } else {
                let size320 = videoInfo.audio_sizes["320"]; let size128 = videoInfo.audio_sizes["128"];
                qList.innerHTML += `
                    <div onclick="startDownload('320', 'MP3 - 320kbps')" class="flex justify-between items-center bg-[#1A1A1A] hover:bg-[#2A2A2A] border border-white/5 p-4 rounded-xl cursor-pointer">
                        <div class="flex items-center gap-3"><i class="fa-solid fa-headphones text-blue-500"></i><span class="font-bold text-white text-sm">320 kbps <span class="text-xs text-gray-400 font-normal ml-2">• ${size320}</span></span></div>
                        <i class="fa-solid fa-download text-gray-600"></i>
                    </div>`;
                qList.innerHTML += `
                    <div onclick="startDownload('128', 'MP3 - 128kbps')" class="flex justify-between items-center bg-[#1A1A1A] hover:bg-[#2A2A2A] border border-white/5 p-4 rounded-xl cursor-pointer">
                        <div class="flex items-center gap-3"><i class="fa-solid fa-music text-gray-400"></i><span class="font-bold text-white text-sm">128 kbps <span class="text-xs text-gray-400 font-normal ml-2">• ${size128}</span></span></div>
                        <i class="fa-solid fa-download text-gray-600"></i>
                    </div>`;
            }
        }

        function goBack() {
            document.getElementById('formatSelection').style.display = 'grid';
            document.getElementById('qualitySelection').classList.add('hidden');
            document.getElementById('qualityBadge').classList.add('hidden');
        }

        async function startDownload(quality, badgeText) {
            document.getElementById('qualitySelection').classList.add('hidden');
            document.getElementById('progressSection').classList.remove('hidden');
            
            const badge = document.getElementById('qualityBadge');
            badge.innerText = badgeText; badge.classList.remove('hidden');
            
            let progress = 0;
            const fill = document.getElementById('progressFill');
            const text = document.getElementById('btnText');
            const btn = document.getElementById('downloadBtn');
            btn.onclick = null;
            
            fill.className = "progress-fill transition-all duration-300 " + (selectedFormat === 'mp4' ? "bg-gradient-to-r from-red-600 to-orange-500" : "bg-gradient-to-r from-blue-600 to-cyan-500");
            
            progressInterval = setInterval(() => {
                if(progress < 50) progress += 1.5; else if(progress < 85) progress += 0.5; else if(progress < 96) progress += 0.05; 
                fill.style.width = `${progress}%`;
                text.innerHTML = `<i class="fa-solid fa-compact-disc fa-spin mr-2"></i> ĐANG TẢI XUỐNG (${Math.floor(progress)}%)`;
            }, 300);
            
            try {
                const res = await fetch('/api/ytdl/download', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ url: document.getElementById('ytUrl').value, format: selectedFormat, quality: quality.toString(), title: videoInfo.title })
                });
                const data = await res.json();
                clearInterval(progressInterval);
                
                if(data.status === 'success') {
                    fill.style.width = '100%'; fill.className = "progress-fill bg-[#1DB954]";
                    text.innerHTML = `<i class="fa-solid fa-cloud-arrow-down mr-2 text-xl"></i> ẤN ĐỂ LƯU TỆP XUỐNG MÁY!`;
                    btn.onclick = () => {
                        const a = document.createElement('a'); a.href = data.download_url; a.download = data.file_name; 
                        document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    };
                } else {
                    text.innerText = "❌ LỖI: " + data.detail; fill.style.width = '0%';
                }
            } catch(e) { clearInterval(progressInterval); text.innerText = "❌ LỖI KẾT NỐI MẠNG!"; }
        }
    </script>
</body>
</html>
