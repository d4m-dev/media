<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Terminal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e1e;
            color: #cccccc;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background-color: #333333;
            color: #cccccc;
            padding: 8px 15px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #444;
            user-select: none;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #89d185;
            border-radius: 50%;
            display: inline-block;
        }
        .status-dot.offline {
            background-color: #f48771;
        }
        .terminal-container {
            flex-grow: 1;
            padding: 10px 15px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.4;
        }
        .terminal-container::-webkit-scrollbar {
            width: 12px;
        }
        .terminal-container::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        .terminal-container::-webkit-scrollbar-thumb {
            background: #424242;
        }
        .terminal-container::-webkit-scrollbar-thumb:hover {
            background: #4f4f4f;
        }
        .clear-btn {
            background: transparent;
            border: 1px solid #555;
            color: #ccc;
            padding: 3px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
        .clear-btn:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-title">
            <span class="status-dot" id="statusDot"></span>
            <span>Server Terminal — Multi-Project Server</span>
        </div>
        <button class="clear-btn" onclick="clearTerminal()">Clear Output</button>
    </div>
    <div class="terminal-container" id="terminal"></div>

    <script>
        const terminal = document.getElementById('terminal');
        const statusDot = document.getElementById('statusDot');
        let offset = 0;
        let isScrolledToBottom = true;

        terminal.addEventListener('scroll', () => {
            isScrolledToBottom = terminal.scrollHeight - terminal.clientHeight <= terminal.scrollTop + 50;
        });

        function clearTerminal() {
            terminal.innerHTML = '';
        }

        function convertAnsiToHtml(text) {
            const ansiToColor = {
                '0': 'reset',
                '1': 'bold',
                '2': 'dim',
                '4': 'underline',
                '90': '#808080', // gray
                '91': '#f48771', // red
                '92': '#89d185', // green
                '93': '#e5e510', // yellow
                '94': '#569cd6', // blue
                '95': '#c586c0', // magenta
                '96': '#4ec9b0', // cyan
                '97': '#d4d4d4'  // white
            };
            
            let html = '';
            let spanCount = 0;
            
            // Quick escape HTML
            text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            
            const parts = text.split(/\x1b\[/);
            html += parts[0];
            
            for (let i = 1; i < parts.length; i++) {
                const p = parts[i];
                const m = p.match(/^(\d+)(?:;\d+)*m(.*)/s);
                if (m) {
                    const code = m[1];
                    const content = m[2];
                    
                    if (code === '0') {
                        // Close all open spans
                        while (spanCount > 0) {
                            html += '</span>';
                            spanCount--;
                        }
                    } else {
                        const color = ansiToColor[code] || '';
                        let style = '';
                        if (code === '1') style = 'font-weight: bold;';
                        else if (code === '2') style = 'opacity: 0.7;';
                        else if (code === '4') style = 'text-decoration: underline;';
                        else if (color) style = `color: ${color};`;
                        
                        if (style) {
                            html += `<span style="${style}">`;
                            spanCount++;
                        }
                    }
                    html += content;
                } else {
                    html += '\x1b[' + p;
                }
            }
            
            while (spanCount > 0) {
                html += '</span>';
                spanCount--;
            }
            
            return html;
        }

        async function fetchLogs() {
            try {
                const response = await fetch(`/api/logs?offset=${offset}`);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                statusDot.classList.remove('offline');
                
                if (data.logs && data.logs.length > 0) {
                    const rawLogs = data.logs.join('');
                    const htmlLogs = convertAnsiToHtml(rawLogs);
                    
                    const logSpan = document.createElement('span');
                    logSpan.innerHTML = htmlLogs;
                    terminal.appendChild(logSpan);
                    
                    offset = data.next_offset;
                    
                    if (isScrolledToBottom) {
                        terminal.scrollTop = terminal.scrollHeight;
                    }
                } else if (data.next_offset < offset) {
                    // Server restarted
                    offset = 0;
                    clearTerminal();
                    const span = document.createElement('span');
                    span.innerHTML = '<span style="color: #e5e510">--- Server Restarted ---</span><br/>';
                    terminal.appendChild(span);
                }
            } catch (error) {
                statusDot.classList.add('offline');
            }
            
            setTimeout(fetchLogs, 1000);
        }

        // Start fetching
        fetchLogs();
    </script>
</body>
</html>
