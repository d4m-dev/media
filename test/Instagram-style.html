<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/1200px-Instagram_logo.svg.png" alt="Instagram Logo">
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Tìm kiếm">
            </div>
            <div class="nav-icons">
                <i class="fas fa-home"></i>
                <i class="far fa-paper-plane"></i>
                <i class="far fa-compass"></i>
                <i class="far fa-heart"></i>
                <img class="avatar" src="https://i.pravatar.cc/30" alt="Avatar">
            </div>
        </div>
    </header>

    <main class="container">
        <section id="post-feed">
            </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
